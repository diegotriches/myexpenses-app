# Confere tipos, lint e testes das regras puras a cada push e em cada Pull Request.
# Não acessa o banco: não precisa de segredos.
name: CI

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
